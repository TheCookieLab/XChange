name: Maven Release Publish (Disabled by Default)

on:
  workflow_dispatch:
    inputs:
      enable_release:
        description: Set to true to allow publishing a release
        required: true
        default: "false"
      release_version:
        description: Release version (for example 0.1.0)
        required: true
      next_snapshot_version:
        description: Next snapshot version (for example 0.2.0-SNAPSHOT)
        required: true
      release_notes:
        description: Release notes following RELEASE_NOTES_TEMPLATE.md, including Upstream Credits
        required: true

concurrency:
  group: xchange-release-publish
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.enable_release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check release versions and immutable publication collisions
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
        NEXT_SNAPSHOT_VERSION: ${{ inputs.next_snapshot_version }}
      run: |
        python3 scripts/ci/release-check.py preflight \
          --release-version "$RELEASE_VERSION" \
          --next-snapshot-version "$NEXT_SNAPSHOT_VERSION"
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven
    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}
    - name: Configure git user
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    - name: Prepare release
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USER }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASS }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        MAVEN_OPTS: -Xmx3g
        RELEASE_VERSION: ${{ inputs.release_version }}
        NEXT_SNAPSHOT_VERSION: ${{ inputs.next_snapshot_version }}
      run: |
        mvn --batch-mode --no-transfer-progress \
          --settings etc/settings.xml \
          -Prelease-sign-artifacts,central-release-publish \
          -Dgpg.passphrase="$GPG_PASSPHRASE" \
          -DreleaseVersion="$RELEASE_VERSION" \
          -DdevelopmentVersion="$NEXT_SNAPSHOT_VERSION" \
          -DlocalCheckout=true \
          -Dsurefire.fork.tuning.args=-Xmx1g \
          -Darguments="--settings etc/settings.xml -Prelease-sign-artifacts,central-release-publish -Dgpg.passphrase=\"$GPG_PASSPHRASE\" -DskipIntegrationTests=true -Dsurefire.fork.tuning.args=-Xmx1g" \
          release:clean release:prepare
    - name: Perform release
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USER }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASS }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        MAVEN_OPTS: -Xmx3g
      run: |
        mvn --batch-mode --no-transfer-progress \
          --settings etc/settings.xml \
          -Prelease-sign-artifacts,central-release-publish \
          -Dgpg.passphrase="$GPG_PASSPHRASE" \
          -DlocalCheckout=true \
          -Dsurefire.fork.tuning.args=-Xmx1g \
          -Darguments="--settings etc/settings.xml -Prelease-sign-artifacts,central-release-publish -Dgpg.passphrase=\"$GPG_PASSPHRASE\" -DskipIntegrationTests=true -Dsurefire.fork.tuning.args=-Xmx1g" \
          release:perform
    - name: Verify release publication and isolated consumer
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: python3 scripts/ci/release-check.py verify --version "$RELEASE_VERSION"
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        RELEASE_NOTES: ${{ inputs.release_notes }}
      run: |
        gh release create "xchange-parent-$RELEASE_VERSION" \
          --repo "$GITHUB_REPOSITORY" \
          --verify-tag \
          --title "XChange $RELEASE_VERSION" \
          --notes "$RELEASE_NOTES" \
          --latest
    - name: Publish next snapshot
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USER }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASS }}
        MAVEN_OPTS: -Xmx3g
        NEXT_SNAPSHOT_VERSION: ${{ inputs.next_snapshot_version }}
      run: |
        git fetch origin main && git reset --hard origin/main
        CURRENT_VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version"))')"
        if [ "$CURRENT_VERSION" != "$NEXT_SNAPSHOT_VERSION" ]; then
          echo "::error::Expected the post-release development version '$NEXT_SNAPSHOT_VERSION' but found '$CURRENT_VERSION'."
          exit 1
        fi
        mvn --batch-mode --no-transfer-progress \
          --settings etc/settings.xml \
          -Dfmt.skip=true \
          -DskipIntegrationTests=true \
          -Dsurefire.fork.tuning.args=-Xmx1g \
          clean deploy
    - name: Verify next snapshot publication and isolated consumer
      env:
        NEXT_SNAPSHOT_VERSION: ${{ inputs.next_snapshot_version }}
      run: python3 scripts/ci/release-check.py verify --version "$NEXT_SNAPSHOT_VERSION"